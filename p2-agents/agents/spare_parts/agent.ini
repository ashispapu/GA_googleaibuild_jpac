[agent]
description = Checks stock: finds the part in every plant and at the supplier, with time and cost
class = agent:SparePartsAgent
principal = spare_parts
prompt = system_prompt.md
tools = get_bom, check_stock, get_supplier
required_tools = check_stock, get_supplier
max_steps = 4
finish_tool = false

[tasks]
default = task.md
