[agent]
description = Watches the sensors: confirms the ML warning against live signals and alarms
class = agent:MonitorAgent
principal = monitor
prompt = system_prompt.md
tools = get_asset_health, get_signals, get_alarms
; fetched by code if the model skips them (the RESULT needs them)
required_tools = get_asset_health
max_steps = 4

[tasks]
default = task.md

[policy]
; severity bands on risk_72h (C0)
high_risk = 0.7
medium_risk = 0.3
args.get_signals = {"signals": ["vibration_rms", "bearing_temp"], "minutes": 360}
