; Coordinator - defaults that travel with this folder. config/agents.ini [agent.orchestrator] overrides any key.
[agent]
description = Runs the team: plans the investigation, answers questions and sums up
class = agent:OrchestratorAgent
principal = orchestrator
prompt = system_prompt.md
; read tools for answering questions (incident record, machine health); plan and summary modes do not use them
tools = get_incident, get_asset_health
; teammates it may consult (they work and report back)
sub_agents = monitor, diagnosis, spare_parts, scheduler, energy
; teammates it may divert a question to (they answer the user directly)
handoff_targets = diagnosis, spare_parts, scheduler, energy, decision
max_steps = 4

[tasks]
plan = task_plan.md
summary = task_summary.md
answer = task_answer.md
