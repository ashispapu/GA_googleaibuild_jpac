[agent]
description = Plans the repair: order deadline, production schedule, who can do the job and when
class = agent:SchedulerAgent
principal = scheduler
prompt = system_prompt.md
tools = get_orders, get_schedule, find_technicians
required_tools = get_orders, get_schedule, find_technicians
max_steps = 4
finish_tool = false

[tasks]
default = task.md

[policy]
args.find_technicians = {"skill": "{{required_skill}}"}
args.get_schedule = {"hours": 96}
