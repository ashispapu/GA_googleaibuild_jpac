[agent]
description = Finds the cause: reads manuals, past failures, quality data and the ML drivers
class = agent:DiagnosisAgent
principal = diagnosis
prompt = system_prompt.md
tools = get_asset_health, get_signals, search_manuals, get_maintenance_history, get_defects, get_bom
required_tools = search_manuals, get_maintenance_history, get_defects, get_bom, get_signals, get_asset_health
; helper that digs through manuals + work orders and reports back
sub_agents = manual_researcher
max_steps = 6

[tasks]
default = task.md

[policy]
failure_modes = bearing_wear, overheating, misalignment
keywords.bearing_wear = bearing
keywords.overheating = overheat, temperature
keywords.misalignment = misalign
root_cause_suffix.bearing_wear = wear
root_cause_suffix.overheating = overheating
root_cause_suffix.misalignment = misalignment
label.bearing_wear = Rear bearing wear
; confidence = sum of the weights of the sources that agree, capped (no inspection yet)
w_ml_mode = 0.25
w_manual = 0.15
w_history = 0.15
w_quality = 0.05
w_sensor = 0.0
max_confidence = 0.85
; true = a technician-confirmed similar case raises the confidence (AG-9). Off for a repeatable demo.
use_case_memory = false
max_evidence = 6
; manual search per failure mode the ML suggests (any machine type: the search is scoped to the machine's own manual)
query.bearing_wear = spindle vibration rising bearing
query.misalignment = vibration rising normal kurtosis misalignment
query.overheating = motor temperature rising overheating cooling
query.unknown = vibration temperature rising fault
args.search_manuals = {"query": "{{mode_query}}", "asset_id": "{{asset_id}}", "top_k": 5}
args.get_signals = {"signals": ["vibration_rms"], "minutes": 360}
args.get_defects = {"hours": 24}
