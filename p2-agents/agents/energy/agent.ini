[agent]
description = Saves power: energy, cost and CO2 of each option, and how much extra power the worn part draws
class = agent:EnergyAgent
principal = energy
prompt = system_prompt.md
tools = get_energy, get_tariffs, get_co2_factor
required_tools = get_energy, get_tariffs, get_co2_factor
max_steps = 4
finish_tool = false

[tasks]
default = task.md
