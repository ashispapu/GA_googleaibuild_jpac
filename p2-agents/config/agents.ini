; =====================================================================================================================
; PlantGuard AI - agent layer configuration (P2). Everything about the agents is configured here; nothing is hard-coded.
;
;   central file : p2-agents/config/agents.ini  (override path with env PLANTGUARD_AGENTS_INI)
;   per agent    : p2-agents/agents/<name>/agent.ini  (folder defaults; [agent.<name>] / [policy.<name>] /
;                  [tasks.<name>] here override them key by key)
;
; Secrets never go in this file: the LLM key is read from the env var named by [llm] api_key_env.
; =====================================================================================================================

[runtime]
; live   = real agents (LLM via LiteLLM) - replay = always stream the recorded INC-0042 run
mode = live
; raise   = on LLM failure the backend emits LLM_UNAVAILABLE and replays the recorded run (C3 default)
; degrade = emit one ERROR event and finish every agent rule-based from tool data (no LLM wording)
on_llm_failure = raise
; whole run budget (C3 target: < 60 s). Exceeding it counts as a failure (see on_llm_failure).
; Retry/pacing waits count too: with a rate-limited key (e.g. free tier, 5 req/min) a full run needs a few minutes,
; so the budget is generous; lower it for demos on a paid key.
max_run_seconds = 600
; hand-offs (divert task to another agent) allowed per run
max_handoffs = 3
; nesting of ask_<agent> sub-agent calls (1 = sub-agents cannot call their own sub-agents)
max_subagent_depth = 2
; live mode but the key env var ([llm] api_key_env) is empty -> keep the replay (set false for keyless/local models)
require_api_key = true

[streaming]
; master switch for *_delta events (thinking + answer tokens). Off = only the closing THOUGHT/MESSAGE events.
enabled = true
stream_thinking = true
stream_messages = true
; coalesce tokens into one delta event every N chars or every N ms, whichever comes first
flush_chars = 48
flush_interval_ms = 120
; C3: THOUGHT messages are <= 200 chars of plain language
thought_max_chars = 200
message_max_chars = 1500

[llm]
; litellm (default) | scripted (offline rehearsal/tests) | package.module:Class
provider = litellm
; any LiteLLM model string. Gemini: gemini/<model>. Per-agent override: [agent.<name>] model = ...
; Check the setup with one request:  cd p2-agents && python -m llm.check
; Gemini API with a key (AI Studio key, or a Google Cloud key whose project has "Generative Language API" enabled and
; allowed in the key's API restrictions):  model = gemini/gemini-2.5-flash, api_key_env = GEMINI_API_KEY
; Vertex AI (no API key; billed to the project): run `gcloud auth application-default login` once, then
;   model = vertex_ai/gemini-2.5-flash
;   api_key_env =
;   extra_params = {"vertex_project": "<your-project-id>", "vertex_location": "us-central1"}
model = gemini/gemini-2.5-flash
api_key_env = GEMINI_API_KEY
api_base =
; network: empty = HTTPS_PROXY/HTTP_PROXY or LLM_PROXY from .env/shell, else the OS proxy settings;
; a URL (http://127.0.0.1:3128) = always use it; none = direct, ignore every proxy. Usually leave empty and switch in .env.
proxy =
temperature = 0.2
max_tokens = 2048
timeout_s = 20
; LiteLLM's own retries; keep 0, the backoff below handles retries (and shows them in the UI)
num_retries = 0
; exponential backoff for rate limits (429), overload/5xx, timeouts, dropped connections:
; wait retry_base_s, then x2 each try (+/-25% jitter), capped at retry_max_s; never shorter than the server's
; "retry in N s". Only retried before anything was streamed. Bad key / bad request / daily quota fail at once.
retry_max_attempts = 5
retry_base_s = 2
retry_max_s = 60
; client-side pacing per model, shared by all agents: 0 = off. Gemini free tier allows 5 requests/min per model.
requests_per_minute = 0
; thinking: reasoning_effort = low|medium|high|disable, or an explicit thinking_budget_tokens (wins if set)
reasoning_effort = low
thinking_budget_tokens =
include_thoughts = true
; C7: redact every prompt (serials, names, emails, PLC tags, IPs). Keep true.
redact = true
; extra LiteLLM kwargs as JSON, e.g. {"top_p": 0.9}
extra_params = {}

[tools]
; max characters of one tool result shown to the model
max_result_chars = 4000
; contract tools switched off for every agent
disabled =

[agents]
; empty = every folder under agents/ with an agent.py; otherwise a comma list
enabled =

; ---------------------------------------------------------------- flows: which agents run, in which order, per trigger
; step = <agent>[:<mode>]   modes: pipeline (typed RESULT), plan, summary, answer, or any task template key
[flow.ml_alert]
steps = orchestrator:plan, monitor, diagnosis, spare_parts, scheduler, energy, decision, orchestrator:summary

[flow.alarm]
steps = orchestrator:plan, monitor, diagnosis, spare_parts, scheduler, energy, decision, orchestrator:summary

[flow.user_question]
steps = orchestrator:answer

; ---------------------------------------------------------------- per-agent overrides (examples, all optional)
; [agent.diagnosis]
; model = gemini/gemini-2.5-pro
; max_steps = 8
; sub_agents = manual_researcher
; [agent.orchestrator]
; handoff_targets = diagnosis, spare_parts

[policy.handoff]
; mode the target agent runs in after a hand-off
target_mode = answer
event_message = Handed to {target}: {task}
reply_message = This is now with {target}. Expect the answer from there.
; {reason} = why, in plain words (daily quota used up, no key, network ...)
degraded_message = The AI model isn't available ({reason}); the analysis continues with rules only.

; ---------------------------------------------------------------- evidence rules (tools/plant presenters)
[policy.evidence]
rule_threshold_vibration_rms = 4.5
manual_min_score = 0.8
manual_max_evidence = 1
history_max_evidence = 1
defect_trend_min_pct = 100
ml_top_drivers = 2
sensor_evidence_first_only = true
excess_power_min_pct = 3

; ---------------------------------------------------------------- planning maths (spare parts, scheduler, energy, decision)
; Shipped values reproduce the golden story (CONTRACTS.md C9). Change them only together with the team.
[policy.planning]
; data = plan from the data's own clock (ML evaluated_at) | wallclock = from now
reference_time = data
; part logistics
transfer_modes = express, standard
express_transfer_eta_h = 6
express_transfer_eur = 900
standard_transfer_eta_h = 20
standard_transfer_eur = 350
supplier_available_qty = 50
supplier_shipping_eur = 0
; v1.2: express delivery surcharge from the supplier (same value as the plant ERP)
supplier_express_eur = 250
; v1.2: options that need the supplier's part include a purchase order (the simulated plant turns this on;
; the scripted story keeps its recorded options unchanged)
purchase_orders = false
; pick the cheapest source arriving within RUL x this factor
eta_safety_factor = 0.5
; repair window
repair_hours = 2.5
shift.morning = 6-14
shift.evening = 14-22
shift.night = 22-6
preferred_shifts = night
night_shifts = night
required_skill = bearing_replacement
; the skill a repair needs: by part-number prefix first, then by failure mode (required_skill is the last fallback)
skill_by_part_prefix = SKF:bearing_replacement, RV:bearing_replacement, ALN:alignment, PRS:alignment, CAL:alignment, BLT:alignment, FIX:alignment, HYD:hydraulics, CLT:electrical, SRV:electrical, MTR:electrical, PSU:electrical
skill_by_mode = bearing_wear:bearing_replacement, misalignment:alignment, overheating:electrical
; wording per failure mode (option actions, risks, work order titles)
repair_noun = bearing_wear:Bearing swap, misalignment:Realignment, overheating:Cooling repair
risk_noun = bearing_wear:bearing, misalignment:the machine, overheating:the machine
repair_verb = bearing_wear:Replace, misalignment:Fit, overheating:Replace
repair_word = bearing_wear:swap, misalignment:realign, overheating:repair
technicians_needed = 1
prefer_off_shift_now = true
; run slower until the repair when risk_72h >= threshold
reduced_speed_pct = 70
slow_down_risk_threshold = 0.5
; production model
line_rate_units_per_h = 37.5
shift_hours = 8
stop_loses_whole_shifts = true
; energy model: power ~ speed^exponent; results rounded to kwh_round
power_speed_exponent = 1.2
kwh_round = 10
restart_offsets_savings = true
excess_pct_decimals = 0
; cost model (EUR)
downtime_eur_per_h = 2000
downtime_eur_per_h_night = 560
labour_eur = 400
night_premium_eur = 250
late_penalty_eur = 5000
swap_when_stopped_h = 2.0
failure_downtime_h = 14
expected_failure_threshold = 0.5
reduced_speed_risk_factor = 0.45
; v1.2 options chat: wear rate grows with line speed ^ this (same as the plant simulation)
speed_exponent = 1.5
stop_now_confidence = 0.9
run_to_failure_confidence = 0.85
; C0: confidence < 0.70 => needs_human_review
review_threshold = 0.70
always_review = true

; ---------------------------------------------------------------- option strategies (Energy + Decision), in order
; strategy = stop_now | slow_then_swap | run_to_supplier
; text placeholders: {line_num} {line_id} {asset_id} {sku} {part_name} {from_name} {to_name} {speed_pct}
;                    {repair_day} {repair_shift} {supplier_days}
[option.OPT-A]
strategy = stop_now
transfer_mode = express
label = Stop now, repair today
summary = Stop Line {line_num}, {get_fast}, repair as soon as it arrives.
transfer_description = Express 1× {sku} {from_name} → {to_name}
energy_note = Restart spike offsets savings

[option.OPT-B]
strategy = slow_then_swap
transfer_mode = standard
label = Run at {speed_pct}%, repair {repair_day} {repair_shift}
summary = Slow Line {line_num} to {speed_pct}% to cut the load, {get_standard}, {repair_word} on the {repair_shift} shift.
transfer_description = Standard transfer 1× {sku} {from_name} → {to_name}
energy_note = Slower running + off-peak repair

[option.OPT-C]
strategy = run_to_supplier
label = Keep running, order from supplier
summary = Run at full speed and wait {supplier_days} days for the supplier.
energy_note = Worn part keeps wasting power
