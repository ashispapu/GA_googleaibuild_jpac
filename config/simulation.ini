; PlantGuard plant simulation (DATA_MODE=sim, the default when you start the backend).
; Everything the simulated plant does is set here; nothing is hard-coded. Times are PLANT time unless noted.

[clock]
; plant minutes per real minute: 60 = one real minute is one plant hour (shifts, transfers and repairs stay watchable)
scale = 60
; plant time at the first start: now = real now. Kept across restarts (stored in the database).
start = now

[storage]
; where the two databases and the FAISS index live (relative to the repo root)
data_dir = var/plantguard
; true = wipe and reseed on every start; false = keep the plant (and its incidents, sessions, logs) across restarts
reset_on_start = false
; plant hours of sensor history kept in the historian
history_retention_h = 72
; plant minutes between historian samples (OT historian resolution)
history_interval_min = 5
; plant hours of history created when the plant is seeded
history_backfill_h = 24

[telemetry]
; real seconds between live readings (one reading per machine; the OT stream and the ML scorer use them)
interval_s = 1.0
noise = 0.02

[faults]
; random faults: average plant hours between two new faults anywhere in the plant (exponential distribution)
mean_interval_h = 10
; never more than this many developing faults at once
max_concurrent = 3
; plant hours from fault start to breakdown, picked uniformly per fault (slower when the line runs slower)
breakdown_h_min = 30
breakdown_h_max = 90
; wear speed scales with line speed ^ this exponent (70% speed -> 0.7^1.5 = 59% wear rate)
speed_exponent = 1.5
; chance that a misalignment also raises kurtosis (looks like bearing wear -> the AI may pick the wrong repair)
misalignment_looks_like_bearing = 0.35
; chance that a correct repair is still done badly and the fault comes back (bad install)
bad_install_probability = 0.05
; set false to stop new random faults (the initial ones below still develop)
random = true

[faults.initial]
; faults already developing when a fresh plant is seeded: asset_id = failure_mode@progress
; (progress 0..1; around 0.25 the ML model starts to notice, 0.75 trips the classic vibration rule, 1.0 = breakdown)
EQ-3012 = bearing_wear@0.30

[health]
; real seconds between ML scoring cycles
score_interval_s = 5
; plant minutes of readings in one scoring window (C5: 10)
window_min = 10
; risk at or above this opens an incident (C5: 0.7)
alert_risk = 0.70
; plant minutes between two alerts for the same machine
alert_debounce_min = 30

[repair]
; plant minutes the machine is watched after the technician reports the repair done
verify_min = 30
; the repair counts as working when the risk stays below this during verification and no alarm is active
verify_max_risk = 0.30
; the technician may only start when every part of the work order is in stock at the plant
require_parts_in_stock = true

[approvals]
; Approval chain: nothing in an option is created until every required person has signed.
; The requesting plant's maintenance lead (or plant manager) always signs first.
enabled = true
; an option that takes a part from ANOTHER plant's stock also needs that plant's lead to release it
source_plant_release = true
; ... and the plant manager must co-sign when the option costs more than this (EUR) ...
manager_cosign_over_eur = 10000
; ... or stops the line for longer than this (plant hours)
manager_cosign_stop_h = 4

[production]
; units per hour at 100% speed (same as p2-agents [policy.planning] line_rate_units_per_h)
line_rate_units_per_h = 37.5
; share of output inspected; a developing fault raises the defect rate on its line
inspection_share = 0.05
base_defect_rate = 0.004

[agents]
; live incidents never fall back to the INC-0042 recording (it is a different machine). Without an LLM, agents
; finish rule-based on the real data instead.
on_llm_failure = degrade
