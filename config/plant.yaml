# The simulated plant (DATA_MODE=sim). Seeded into the OT and IT databases on first start.
# IDs match the golden story (fixtures/story) so EQ-3012, SKF-6205, SUP-17, TECH-104 ... mean the same everywhere.

# ---------------------------------------------------------------- machine models (OT behaviour + IT master data)
models:
  spindle:
    model: CNC Spindle 200
    manufacturer: Kessler Spindeltechnik
    manual: MAN-SPINDLE-200
    controller: Siemens S7-1500
    device: SPDL
    baseline: {vibration_rms: 2.1, bearing_temp: 58, motor_temp: 62, spindle_rpm: 12000, motor_current: 21, power_kw: 11.0}
    alarm: {vibration_warn: 4.0, vibration_crit: 4.5, temp_warn: 76, temp_crit: 84}
    defect: {type: bore_diameter, spec_min: 9.98, spec_max: 10.03, nominal: 10.005}
    bom: [SKF-6205, SKF-7008, BLT-HTD-8M, ALN-KIT-200, CLT-PUMP-24]
    modes:
      bearing_wear: {part: SKF-6205, root_cause: "Rear spindle bearing (SKF-6205) outer race wear"}
      misalignment: {part: ALN-KIT-200, root_cause: "Spindle to motor coupling misaligned"}
      overheating: {part: CLT-PUMP-24, root_cause: "Spindle coolant pump (CLT-PUMP-24) delivering low flow"}
  press:
    model: HP-400 Hydraulic Press
    manufacturer: Hydropress AG
    manual: MAN-PRESS-400
    controller: Rockwell ControlLogix
    device: HPRS
    baseline: {vibration_rms: 1.6, bearing_temp: 52, motor_temp: 60, spindle_rpm: 1450, motor_current: 38, power_kw: 22.0}
    alarm: {vibration_warn: 3.0, vibration_crit: 3.4, temp_warn: 74, temp_crit: 82}
    defect: {type: press_depth, spec_min: 24.9, spec_max: 25.1, nominal: 25.0}
    bom: [HYD-CLR-400, SKF-6308, PRS-GDE-KIT, HYD-FLT-10]
    modes:
      overheating: {part: HYD-CLR-400, root_cause: "Hydraulic oil cooler (HYD-CLR-400) fouled, oil running hot"}
      bearing_wear: {part: SKF-6308, root_cause: "Pump motor bearing (SKF-6308) wear"}
      misalignment: {part: PRS-GDE-KIT, root_cause: "Ram guide gibs worn, ram running out of line"}
  robot:
    model: AR-6 Assembly Robot
    manufacturer: Motoko Robotics
    manual: MAN-ROBOT-6
    controller: AR-6 controller
    device: ROB
    baseline: {vibration_rms: 1.2, bearing_temp: 45, motor_temp: 55, spindle_rpm: 3000, motor_current: 9, power_kw: 4.0}
    alarm: {vibration_warn: 2.3, vibration_crit: 2.6, temp_warn: 69, temp_crit: 77}
    defect: {type: screw_torque, spec_min: 2.9, spec_max: 3.3, nominal: 3.1}
    bom: [SRV-FAN-80, RV-BRG-40, CAL-KIT-AR6]
    modes:
      overheating: {part: SRV-FAN-80, root_cause: "Axis 2 servo cooling fan (SRV-FAN-80) failing"}
      bearing_wear: {part: RV-BRG-40, root_cause: "Axis 2 reducer bearing (RV-BRG-40) wear"}
      misalignment: {part: CAL-KIT-AR6, root_cause: "Tool centre point drifted, robot out of calibration"}
  conveyor:
    model: BC-1200 Belt Conveyor
    manufacturer: Transflow
    manual: MAN-CONV-1200
    controller: Siemens S7-1200
    device: CONV
    baseline: {vibration_rms: 1.8, bearing_temp: 40, motor_temp: 48, spindle_rpm: 1450, motor_current: 6, power_kw: 2.2}
    alarm: {vibration_warn: 3.4, vibration_crit: 3.9, temp_warn: 62, temp_crit: 70}
    defect: {type: part_damage, spec_min: 0.0, spec_max: 0.2, nominal: 0.05}
    bom: [BLT-TRK-KIT, SKF-6204, MTR-DRV-15]
    modes:
      misalignment: {part: BLT-TRK-KIT, root_cause: "Belt tracking off, belt running against the side frame"}
      bearing_wear: {part: SKF-6204, root_cause: "Drive roller bearing (SKF-6204) wear"}
      overheating: {part: MTR-DRV-15, root_cause: "Drive motor (MTR-DRV-15) winding overheating"}
  inspection:
    model: TT-50 Torque Tester
    manufacturer: Measurix
    manual: MAN-TESTER-50
    controller: TT-50 controller
    device: TST
    baseline: {vibration_rms: 0.6, bearing_temp: 35, motor_temp: 40, spindle_rpm: 600, motor_current: 2, power_kw: 0.8}
    alarm: {vibration_warn: 1.2, vibration_crit: 1.3, temp_warn: 54, temp_crit: 62}
    defect: {type: false_reject, spec_min: 0.0, spec_max: 0.5, nominal: 0.1}
    bom: [PSU-TT50, FIX-TT50, SKF-6001]
    modes:
      overheating: {part: PSU-TT50, root_cause: "Measuring head power supply (PSU-TT50) overheating"}
      misalignment: {part: FIX-TT50, root_cause: "Test fixture worn, parts seated off-centre"}
      bearing_wear: {part: SKF-6001, root_cause: "Rotary table bearing (SKF-6001) wear"}

# ---------------------------------------------------------------- how a failure mode shows in the signals (at progress 1.0, full speed)
# multipliers (x) apply to the baseline, offsets (+) are added. kurtosis baseline is 3.0.
signatures:
  # vibration crosses the classic rule (alarm.vibration_crit) at ~75% progress; motor temperature at ~76%
  bearing_wear: {vibration_rms_x: 2.55, kurtosis_add: 3.0, bearing_temp_add: 12, motor_temp_add: 3, current_x: 1.04, power_x: 1.10}
  misalignment: {vibration_rms_x: 2.40, kurtosis_add: 0.4, bearing_temp_add: 5, motor_temp_add: 2, current_x: 1.06, power_x: 1.06}
  # a misalignment that also loosened the mount: impulsive like a bearing fault (the AI can be fooled)
  misalignment_loose: {vibration_rms_x: 2.40, kurtosis_add: 2.4, bearing_temp_add: 6, motor_temp_add: 2, current_x: 1.06, power_x: 1.07}
  overheating: {vibration_rms_x: 1.15, kurtosis_add: 0.2, bearing_temp_add: 10, motor_temp_add: 29, current_x: 1.18, power_x: 1.12}

