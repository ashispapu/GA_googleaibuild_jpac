# docker-compose only: spreads the browser's calls over the api replicas (Cloud Run does this in production).
# ip_hash = session affinity, like --session-affinity on Cloud Run (a WebSocket stays on its instance).
events {}
http {
  upstream api { ip_hash; server api:8000 max_fails=3 fail_timeout=5s; }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8000;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }
  }
}
