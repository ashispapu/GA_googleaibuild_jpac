# Builds (and optionally deploys) PlantGuard.
#   images only:   gcloud builds submit --config deploy/gcp/cloudbuild.yaml --substitutions=_REGION=...,_API_URL=...,_TAG=v1 .
#   CI/CD trigger: same file with _DEPLOY=true: build -> push -> migrate job -> roll out engine, worker, api, web
# The services themselves are created once by deploy/gcp/10-services.sh; this pipeline only rolls out new images.
substitutions:
  _REGION: asia-south1
  _NAME: plantguard
  _TAG: manual
  _API_URL: ""          # https://plantguard-api-<project number>.<region>.run.app
  _PLANT_TZ: UTC
  _DEPLOY: "false"
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 2400s
steps:
  - id: api-image
    name: gcr.io/cloud-builders/docker
    args: [build, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_NAME}/api:${_TAG}",
           -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_NAME}/api:latest", .]
  - id: web-image
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: [build, --build-arg, "NEXT_PUBLIC_API_URL=${_API_URL}", --build-arg, "NEXT_PUBLIC_PLANT_TZ=${_PLANT_TZ}",
           -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_NAME}/web:${_TAG}",
           -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_NAME}/web:latest", -f, p3-frontend/Dockerfile, .]
  - id: auth-image
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args: [build, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_NAME}/auth:${_TAG}",
           -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_NAME}/auth:latest", deploy/keycloak]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_NAME}/api"]
  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_NAME}/web"]
  - id: push-auth
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_NAME}/auth"]
  - id: rollout
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        [ "${_DEPLOY}" = "true" ] || { echo "images pushed; _DEPLOY=false so nothing is rolled out"; exit 0; }
        IMG=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_NAME}
        # 1. schema migrations first (backwards compatible: old and new code both run on the new schema)
        gcloud run jobs update ${_NAME}-migrate --image=$$IMG/api:${_TAG} --region=${_REGION}
        gcloud run jobs execute ${_NAME}-migrate --region=${_REGION} --wait
        # 2. the backend roles, then the web app (each rollout waits for the startup probe)
        for s in engine worker api; do
          gcloud run services update ${_NAME}-$$s --image=$$IMG/api:${_TAG} --region=${_REGION}
        done
        gcloud run jobs update ${_NAME}-backup --image=$$IMG/api:${_TAG} --region=${_REGION}
        gcloud run services update ${_NAME}-web --image=$$IMG/web:${_TAG} --region=${_REGION}
images: []
