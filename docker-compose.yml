# PlantGuard AI full stack.   make up   (SSO too:  make up-sso)
# api       http://localhost:8000/docs      timescale 5432      redis 6379
# qdrant    http://localhost:6333           mosquitto 1883      keycloak http://localhost:8080 (profile "sso")
# Secrets come from .env (copy .env.example). Defaults below are for local demo only.
name: plantguard

services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      AUTH_MODE: ${AUTH_MODE:-local}
      JWT_SECRET: ${JWT_SECRET:-demo-secret-change-me}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}          # public URL = token issuer
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080                   # how the api container fetches public keys
      DATABASE_URL: postgresql://plantguard:${POSTGRES_PASSWORD:-plantguard}@timescale:5432/plantguard
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      timescale: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
      mosquitto: {condition: service_started}
    restart: unless-stopped

  timescale:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: plantguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantguard}
      POSTGRES_DB: plantguard
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["timescale-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantguard -d plantguard"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["127.0.0.1:1883:1883"]
    volumes: ["./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]

  keycloak:
    profiles: ["sso"]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    volumes: ["./config/keycloak/plantguard-realm.json:/opt/keycloak/data/import/plantguard-realm.json:ro"]

volumes:
  timescale-data:
  qdrant-data:
